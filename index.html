<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Haunted Manors - Deluxe 3D</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { background-color: #020204; color: #fff; font-family: 'Courier New', Courier, monospace; overflow: hidden; width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        #crosshair { position: absolute; top: 50%; left: 50%; width: 6px; height: 6px; background: rgba(255,255,255,0.6); border-radius: 50%; transform: translate(-50%, -50%); z-index: 3; pointer-events: none; display: none; }
        #ui-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; }
        .hud-panel { background: rgba(10, 10, 15, 0.85); border: 1px solid #771111; padding: 10px 18px; border-radius: 6px; font-size: 15px; color: #eee; text-shadow: 1px 1px 2px #000; pointer-events: auto; }
        #lobby-menu { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(3, 3, 6, 0.98); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; pointer-events: auto; }
        h1 { color: #b22222; font-size: 42px; text-transform: uppercase; letter-spacing: 6px; margin-bottom: 10px; text-shadow: 0 0 20px #ff0000; text-align: center; }
        p.subtitle { color: #888; margin-bottom: 30px; font-size: 14px; letter-spacing: 1px; text-align: center; }
        .btn { background: #1a1010; color: #ddd; border: 1px solid #771111; padding: 14px 28px; margin: 8px; font-family: inherit; font-size: 16px; cursor: pointer; transition: all 0.2s; min-width: 250px; border-radius: 4px; }
        .btn:hover { background: #b22222; color: #fff; border-color: #ff0000; box-shadow: 0 0 20px #ff0000; }
        input[type="text"] { background: #111; border: 1px solid #771111; color: #00ffcc; padding: 12px; font-family: inherit; font-size: 18px; text-align: center; margin-bottom: 12px; width: 250px; border-radius: 4px; text-transform: uppercase; letter-spacing: 3px; }
        #room-code-display { font-size: 26px; color: #00ffcc; letter-spacing: 4px; font-weight: bold; margin: 10px 0; text-shadow: 0 0 10px #00ffcc; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

<div id="canvas-container"></div>
<div id="crosshair"></div>

<div id="ui-overlay">
    <div style="display: flex; justify-content: space-between;">
        <div class="hud-panel">VẬT PHẨM: <span id="items-count" style="color: #ffd700; font-weight: bold;">0/4</span></div>
        <div style="display: flex; gap: 10px;">
            <div class="hud-panel" id="status-hiding" style="color: #ff5555; display:none;">ĐANG NÚP TRONG TỦ</div>
            <div class="hud-panel">TẦNG: <span id="floor-display" style="color: #00ffff; font-weight: bold;">1</span></div>
            <button class="hud-panel" style="cursor:pointer; background:#661111;" onclick="quitToMenu()">THOÁT GAME</button>
        </div>
    </div>
    <div class="hud-panel" style="align-self: center; background: rgba(0,0,0,0.95); text-align: center; border-color: #771111;">
        [W A S D] Di chuyển | [Chuột] Nhìn xung quanh | [Shift] Chạy | [F] Đèn pin | [E] Nhặt đồ / Lên xe | [Q] Núp tủ
    </div>
</div>

<div id="lobby-menu">
    <h1>CĂN NHÀ HOANG 3D - DELUXE</h1>
    <p class="subtitle">ĐỒ HỌA SỐNG ĐỘNG - GÓC NHÌN THỨ NHẤT HOÀN HẢO</p>
    
    <div id="menu-initial">
        <button class="btn" onclick="startSinglePlayer()">CHƠI ĐƠN (SOLO)</button><br>
        <button class="btn" onclick="hostGame()">TẠO PHÒNG CO-OP</button><br>
        <button class="btn" onclick="showJoinInput()">THAM GIA PHÒNG</button>
    </div>

    <div id="menu-join" style="display: none;">
        <input type="text" id="join-code-input" placeholder="NHẬP MÃ PHÒNG" maxlength="6">
        <br>
        <button class="btn" onclick="joinGame()">KẾT NỐI NGAY</button>
        <button class="btn" style="border-color: #444;" onclick="resetMenu()">QUAY LẠI</button>
    </div>

    <div id="menu-waiting" style="display: none; text-align: center;">
        <p>MÃ PHÒNG CỦA BẠN:</p>
        <div id="room-code-display">----</div>
        <p style="color: #aaa; font-size: 13px;">Đang đợi bạn bè kết nối...</p>
    </div>
</div>

<script>
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x020205);
    scene.fog = new THREE.FogExp2(0x020205, 0.04);

    const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    container.appendChild(renderer.domElement);

    // Ánh sáng môi trường và điểm sáng nội thất chân thực
    const ambientLight = new THREE.AmbientLight(0x1a1a24, 0.6);
    scene.add(ambientLight);

    const interiorLight1 = new THREE.PointLight(0xffaa55, 1.2, 18);
    interiorLight1.position.set(0, 4.5, 0);
    scene.add(interiorLight1);

    const interiorLight2 = new THREE.PointLight(0xffaa55, 1.2, 18);
    interiorLight2.position.set(0, 9.5, 0);
    scene.add(interiorLight2);

    // Xây dựng chi tiết ngôi nhà (Tường gạch, sàn gỗ, cột trụ)
    const wallMat = new THREE.MeshStandardMaterial({ color: 0x2b2522, roughness: 0.9 });
    const floorMat = new THREE.MeshStandardMaterial({ color: 0x1f1713, roughness: 0.8 });

    // Tầng 1
    const floor1 = new THREE.Mesh(new THREE.PlaneGeometry(32, 32), floorMat);
    floor1.rotation.x = -Math.PI / 2;
    scene.add(floor1);

    // Tầng 2
    const floor2 = new THREE.Mesh(new THREE.PlaneGeometry(32, 32), floorMat);
    floor2.rotation.x = -Math.PI / 2;
    floor2.position.y = 5.5;
    scene.add(floor2);

    // Cầu thang gỗ tỉ mỉ
    const stairMat = new THREE.MeshStandardMaterial({ color: 0x4a3325, roughness: 0.7 });
    for (let i = 0; i < 10; i++) {
        const step = new THREE.Mesh(new THREE.BoxGeometry(3, 0.3, 0.8), stairMat);
        step.position.set(11, i * 0.55 + 0.15, 5 - i * 0.75);
        scene.add(step);
    }

    // Nội thất trang trí (Bàn ghế hoang tàn như ảnh mẫu)
    const furnitureMat = new THREE.MeshStandardMaterial({ color: 0x3d2817, roughness: 0.9 });
    const table = new THREE.Mesh(new THREE.BoxGeometry(2.5, 1.2, 1.5), furnitureMat);
    table.position.set(-6, 0.6, -6);
    scene.add(table);

    const chair = new THREE.Mesh(new THREE.BoxGeometry(1, 1.5, 1), furnitureMat);
    chair.position.set(-6, 0.75, -4.5);
    scene.add(chair);

    // Xe ô tô tẩu thoát ở tầng 1
    const carGroup = new THREE.Group();
    const carBody = new THREE.Mesh(new THREE.BoxGeometry(3.2, 1.6, 5.5), new THREE.MeshStandardMaterial({ color: 0x8b0000, roughness: 0.5 }));
    carBody.position.y = 0.8;
    carGroup.add(carBody);
    carGroup.position.set(-11, 0, -11);
    scene.add(carGroup);

    // Tủ đồ để núp
    const wardrobeMat = new THREE.MeshStandardMaterial({ color: 0x2e1c0c, roughness: 0.8 });
    const wardrobes = [
        { x: -11, z: 0, floor: 1 },
        { x: 11, z: -11, floor: 2 }
    ];
    wardrobes.forEach(w => {
        const box = new THREE.Mesh(new THREE.BoxGeometry(1.8, 4.5, 1.8), wardrobeMat);
        box.position.set(w.x, w.floor === 1 ? 2.25 : 7.75, w.z);
        scene.add(box);
    });

    // Con ma đi tuần
    const ghost = new THREE.Mesh(
        new THREE.ConeGeometry(0.9, 3.5, 8),
        new THREE.MeshStandardMaterial({ color: 0xff1111, emissive: 0x550000, transparent: true, opacity: 0.85 })
    );
    ghost.position.set(0, 1.75, -5);
    scene.add(ghost);

    let peer = null;
    let conn = null;
    let isHost = false;
    let myRole = 'p1';
    let isMultiplayer = false;
    let audioCtx = null;

    let gameState = {
        players: {
            p1: { x: 0, z: 12, floor: 1, light: true, rx: 0, ry: 0, hiding: false },
            p2: { x: 2, z: 12, floor: 1, light: true, rx: 0, ry: 0, hiding: false }
        },
        items: [
            { id: 1, name: 'Chìa khóa', x: -11, z: 10, floor: 1, taken: false },
            { id: 2, name: 'Bugi', x: 9, z: -9, floor: 2, taken: false },
            { id: 3, name: 'Ắc-quy', x: -9, z: -9, floor: 2, taken: false },
            { id: 4, name: 'Xăng', x: 0, z: -13, floor: 1, taken: false }
        ],
        ghostPos: { x: 0, z: -5, floor: 1 },
        escaped: false
    };

    const itemMeshes = [];
    gameState.items.forEach(item => {
        const mesh = new THREE.Mesh(new THREE.SphereGeometry(0.4, 16, 16), new THREE.MeshStandardMaterial({ color: 0xffd700, emissive: 0x665500 }));
        mesh.position.set(item.x, item.floor === 1 ? 0.4 : 5.9, item.z);
        scene.add(mesh);
        itemMeshes.push({ id: item.id, mesh });
    });

    let keys = {};
    window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
    window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

    // Điều khiển góc nhìn mượt mà bằng chuột
    let mouseRotationX = 0;
    let mouseRotationY = 0;
    window.addEventListener('mousemove', e => {
        if (document.pointerLockElement === document.body) {
            mouseRotationY -= e.movementX * 0.0025;
            mouseRotationX -= e.movementY * 0.0025;
            mouseRotationX = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, mouseRotationX));
        }
    });

    renderer.domElement.addEventListener('click', () => {
        renderer.domElement.requestPointerLock();
    });

    function playHorrorMusic() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        setInterval(() => {
            if (gameState.escaped) return;
            try {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(45, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(20, audioCtx.currentTime + 3);
                gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 3);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 3);
            } catch(e) {}
        }, 6000);
    }

    function startSinglePlayer() {
        isMultiplayer = false;
        document.getElementById('lobby-menu').style.display = 'none';
        document.getElementById('crosshair').style.display = 'block';
        playHorrorMusic();
        renderer.setAnimationLoop(gameLoop);
    }

    function quitToMenu() {
        location.reload();
    }

    function initPeer() {
        const code = Math.random().toString(36).substring(2, 7).toUpperCase();
        peer = new Peer('HM-' + code);
        return code;
    }

    function hostGame() {
        isMultiplayer = true;
        isHost = true;
        myRole = 'p1';
        const code = initPeer();
        document.getElementById('menu-initial').style.display = 'none';
        document.getElementById('menu-waiting').style.display = 'block';
        document.getElementById('room-code-display').innerText = code;

        peer.on('connection', c => {
            conn = c;
            setupConnection();
            document.getElementById('lobby-menu').style.display = 'none';
            document.getElementById('crosshair').style.display = 'block';
            playHorrorMusic();
        });
    }

    function showJoinInput() {
        document.getElementById('menu-initial').style.display = 'none';
        document.getElementById('menu-join').style.display = 'block';
    }

    function resetMenu() {
        document.getElementById('menu-join').style.display = 'none';
        document.getElementById('menu-initial').style.display = 'block';
    }

    function joinGame() {
        const code = document.getElementById('join-code-input').value.trim().toUpperCase();
        if (!code) return;
        isMultiplayer = true;
        myRole = 'p2';
        peer = new Peer();
        
        peer.on('open', () => {
            conn = peer.connect('HM-' + code);
            setupConnection();
            playHorrorMusic();
        });
    }

    function setupConnection() {
        conn.on('open', () => {
            document.getElementById('lobby-menu').style.display = 'none';
            document.getElementById('crosshair').style.display = 'block';
            renderer.setAnimationLoop(gameLoop);
        });

        conn.on('data', data => {
            if (isHost) {
                if (data.type === 'player_update') {
                    gameState.players.p2 = data.player;
                    gameState.items = data.items;
                    gameState.escaped = data.escaped;
                }
            } else {
                if (data.type === 'sync') {
                    gameState = data.state;
                }
            }
        });
    }

    function update() {
        const me = gameState.players[myRole];
        if (!me || gameState.escaped) return;

        me.ry = mouseRotationY;
        me.rx = mouseRotationX;

        if (keys['q'] && !keys['q_lock']) {
            wardrobes.forEach(w => {
                if (w.floor === me.floor && Math.hypot(me.x - w.x, me.z - w.z) < 2) {
                    me.hiding = !me.hiding;
                    document.getElementById('status-hiding').style.display = me.hiding ? 'block' : 'none';
                }
            });
            keys['q_lock'] = true;
        }
        if (!keys['q']) keys['q_lock'] = false;

        if (!me.hiding) {
            let speed = keys['shift'] ? 0.12 : 0.07;
            let moveX = 0, moveZ = 0;

            if (keys['w']) { moveX -= Math.sin(me.ry) * speed; moveZ -= Math.cos(me.ry) * speed; }
            if (keys['s']) { moveX += Math.sin(me.ry) * speed; moveZ += Math.cos(me.ry) * speed; }
            if (keys['a']) { moveX -= Math.cos(me.ry) * speed; moveZ += Math.sin(me.ry) * speed; }
            if (keys['d']) { moveX += Math.cos(me.ry) * speed; moveZ -= Math.sin(me.ry) * speed; }

            me.x += moveX;
            me.z += moveZ;

            me.x = Math.max(-14, Math.min(14, me.x));
            me.z = Math.max(-14, Math.min(14, me.z));

            if (keys['f'] && !keys['f_lock']) {
                me.light = !me.light;
                keys['f_lock'] = true;
            }
            if (!keys['f']) keys['f_lock'] = false;

            // Khu vực cầu thang thông tầng
            if (me.x > 9 && me.x < 13 && me.z > -2 && me.z < 2) {
                if (keys['e'] && !keys['e_lock']) {
                    me.floor = me.floor === 1 ? 2 : 1;
                    document.getElementById('floor-display').innerText = me.floor;
                    keys['e_lock'] = true;
                }
            }
            if (!keys['e']) keys['e_lock'] = false;

            gameState.items.forEach(item => {
                if (!item.taken && item.floor === me.floor) {
                    if (Math.hypot(me.x - item.x, me.z - item.z) < 2 && keys['e']) {
                        item.taken = true;
                    }
                }
            });

            let collected = gameState.items.filter(i => i.taken).length;
            document.getElementById('items-count').innerText = collected + "/4";

            if (collected === 4 && me.floor === 1) {
                if (Math.hypot(me.x - (-11), me.z - (-11)) < 2.5 && keys['e']) {
                    gameState.escaped = true;
                    alert("CHÚC MỪNG! BẠN ĐÃ LÊN XE VÀ TRỐN THOÁT KHỎI CĂN NHÀ MA THÀNH CÔNG!");
                    location.reload();
                }
            }
        }

        if (!isMultiplayer || isHost) {
            let dx = me.x - gameState.ghostPos.x;
            let dz = me.z - gameState.ghostPos.z;
            let dist = Math.hypot(dx, dz);

            if (dist > 0.5) {
                gameState.ghostPos.x += (dx / dist) * 0.028;
                gameState.ghostPos.z += (dz / dist) * 0.028;
            }
            gameState.ghostPos.floor = me.floor;

            // Khi bị ma đụng -> Hồi sinh tại chỗ an toàn ngay lập tức
            if (!me.hiding && dist < 1.3 && me.floor === gameState.ghostPos.floor) {
                me.x = 0;
                me.z = 12;
                me.floor = 1;
                alert("BẠN ĐÃ BỊ MA TÓM TRÚNG! HỒI SINH AN TOÀN TẠI CỬA ĐỂ CHƠI TIẾP!");
            }
        }

        if (isMultiplayer && conn && conn.open) {
            if (isHost) {
                conn.send({ type: 'sync', state: gameState });
            } else {
                conn.send({ type: 'player_update', player: me, items: gameState.items, escaped: gameState.escaped });
            }
        }
    }

    function renderScene() {
        ghost.position.set(gameState.ghostPos.x, gameState.ghostPos.floor === 1 ? 1.75 : 7.25, gameState.ghostPos.z);

        gameState.items.forEach((item, index) => {
            itemMeshes[index].mesh.visible = !item.taken && item.floor === gameState.players[myRole].floor;
        });

        const me = gameState.players[myRole];
        camera.position.set(me.x, (me.floor === 1 ? 0 : 5.5) + 2.3, me.z);

        let targetLookX = me.x - Math.sin(me.ry) * 10;
        let targetLookZ = me.z - Math.cos(me.ry) * 10;
        let targetLookY = (me.floor === 1 ? 0 : 5.5) + 2.3 + Math.sin(me.rx) * 10;
        camera.lookAt(targetLookX, targetLookY, targetLookZ);

        renderer.render(scene, camera);
    }

    function gameLoop() {
        update();
        renderScene();
    }
</script>
</body>
</html>
